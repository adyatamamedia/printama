# ==========================================================
# NGINX CONFIGURATION FOR PRINTAMA LANDING PAGE
# Domain: print.tama.my.id
# ==========================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name print.tama.my.id;

    # Ganti path root sesuai direktori hosting/server Anda
    root /var/www/printama/landing;
    index index.html;

    # 1. Clean URLs: Akses /docs, /changelog, /update tanpa ekstensi .html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 2. Redirect request .html langsung ke Clean URL tanpa .html
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$is_args$args;
    }

    # 3. Redirect /index ke root domain /
    if ($request_uri ~ ^/index(\?.*)?$) {
        return 301 /$is_args$args;
    }

    # 4. Blokir Bad Bots, Scrapers & Vulnerability Scanners
    if ($http_user_agent ~* (sqlmap|nikto|acunetix|wpscan|masscan|zgrab|nmap|havij|libwww-perl)) {
        return 403;
    }

    # 5. Blokir Akses ke File Rahasia / Sensitif (.git, .env, .json, .yml, .md, .sql, .log)
    location ~* \.(git|env|json|lock|md|yml|yaml|sql|bak|log)$ {
        deny all;
        return 404;
    }

    # 6. Blokir Hidden Dotfiles (kecuali .well-known untuk SSL Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # 7. Enterprise Security HTTP Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # 8. Caching File Statis (CSS, JS, Gambar, Favicon)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 9. Gzip Compression untuk Kecepatan Super
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;
}
