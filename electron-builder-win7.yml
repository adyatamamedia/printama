appId: com.adyatamatech.printama.legacy
productName: Printama Legacy (Win 7/8)
directories:
  buildResources: resources
  output: dist-win7
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.js,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!tests/*'
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
win:
  executableName: Printama
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'Printama-Setup-${version}-Win7.${ext}'
  shortcutName: Printama Pas Foto Legacy
  uninstallDisplayName: Printama Pas Foto Legacy
portable:
  artifactName: 'Printama-${version}-Win7-Portable.${ext}'
