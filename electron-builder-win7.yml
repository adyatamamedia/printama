appId: com.adyatamatech.printama.legacy
productName: Printama Legacy (Win 7/8)
compression: maximum
directories:
  buildResources: resources
  output: dist-win7
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.js,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!tests/*'
  - '!node_modules/electron/**/*'
  - '!node_modules/app-builder-bin/**/*'
  - '!node_modules/7zip-bin/**/*'
  - '!node_modules/typescript/**/*'
  - '!node_modules/electron-builder/**/*'
  - '!node_modules/electron-vite/**/*'
  - '!node_modules/vite/**/*'
  - '!node_modules/@esbuild/**/*'
  - '!node_modules/@types/**/*'
  - '!node_modules/*/{test,tests,testing}/**/*'
  - '!node_modules/*/{doc,docs}/**/*'
  - '!node_modules/*/{example,examples}/**/*'
  - '!node_modules/**/*.pdb'
  - '!node_modules/**/*.obj'
  - '!node_modules/**/*.lib'
  - '!node_modules/**/*.exp'
  - '!node_modules/**/*.tlog'
  - '!node_modules/**/build/Release/.deps/**/*'
  - '!node_modules/**/build/Release/obj/**/*'
  - '!node_modules/**/build/Release/*.map'
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
win:
  executableName: Printama
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'Printama-Setup-${version}-Win7.${ext}'
  shortcutName: Printama Pas Foto Legacy
  uninstallDisplayName: Printama Pas Foto Legacy
portable:
  artifactName: 'Printama-${version}-Win7-Portable.${ext}'
